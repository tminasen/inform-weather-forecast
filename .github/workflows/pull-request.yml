name: inform-weather-confirm-flow

on:
  pull_request:
    branches:
      - '*'

jobs:
  check_pull_request:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: setup
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: install
        run: npm ci

      - name: lint
        run: npm run lint:format

      - name: test
        run: npm test

      - name: build
        run: npm run build

      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

      - name: hadolint
        run: docker run --rm -i hadolint/hadolint:v2.15.1 < Dockerfile

      - name: docker build
        run: docker build --platform linux/amd64 --provenance=false --sbom=false .
