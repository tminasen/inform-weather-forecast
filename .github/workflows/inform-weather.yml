name: inform-weather

on:
  workflow_dispatch:
    inputs:
      target:
        description: '通知する日'
        required: true
        default: 'today'
        type: choice
        options:
          - today
          - tomorrow

permissions:
  contents: read

jobs:
  inform:
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: setup
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: install
        run: npm ci

      - name: build
        run: npm run build

      - name: inform weather
        env:
          DISCORD_URL: ${{ secrets.DISCORD_URL }}
          DISCORD_MENTION: ${{ secrets.DISCORD_MENTION }}
        run: node dist/main.js "$TARGET"

      - name: notice-failure
        if: failure()
        env:
          DISCORD_URL: ${{ secrets.DISCORD_URL }}
          DISCORD_MENTION: ${{ secrets.DISCORD_MENTION }}
        run: |
          curl -XPOST -H "Content-Type: application/json" -d "{\"content\": \"$DISCORD_MENTION inform-weather failure :umbrella:\",\"embeds\": [{\"title\": \"build detail\", \"color\": 14427686, \"fields\": [{\"name\": \"repository\",\"value\": \"$GITHUB_REPOSITORY\"}, {\"name\": \"action url\", \"value\": \"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}]}]}" "$DISCORD_URL"
